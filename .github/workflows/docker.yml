name: Build Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check configuration, account hashing and gateway routing
        run: sudo bash tests/run.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ikev2
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build validation image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ikev2:verify
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check actual startup and restart in isolated container
        run: >-
          docker run --rm --privileged --network none
          -e IKEV2_DISPOSABLE_TEST=yes
          -v "${{ github.workspace }}/tests/container-lifecycle.sh:/tmp/ikev2-lifecycle.sh:ro"
          ikev2:verify bash /tmp/ikev2-lifecycle.sh

      - name: Push the verified image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag ikev2:verify "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
