services:
  ikev2:
    image: ghcr.io/marmieqi/ikev2:latest
    pull_policy: always
    container_name: ikev2-mschapv2
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: host
    privileged: true

    # 日志自动轮转：每份 10 MB，最多保留 3 份（含当前日志）。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - /lib/modules:/lib/modules:ro
      - ./ssl:/ssl:ro
      # Account directory must be writable for atomic plaintext -> NT hash updates.
      - ./config:/etc/ikev2
      # Mount the directory so editor atomic saves of .env remain visible.
      - ./:/run/ikev2-config:ro

    environment:
      IKEV2_CONFIG_FILE: /run/ikev2-config/.env
