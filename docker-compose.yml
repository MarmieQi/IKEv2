services:
  ikev2:
    image: ghcr.io/marmieqi/ikev2:latest
    pull_policy: always
    container_name: ikev2-mschapv2
    restart: unless-stopped
    network_mode: host
    privileged: true

    volumes:
      - /lib/modules:/lib/modules:ro
      - ./ssl:/ssl:ro
      - ./config:/etc/ikev2:ro
      # Mount the directory so editor atomic saves of .env remain visible.
      - ./:/run/ikev2-config:ro

    environment:
      IKEV2_CONFIG_FILE: /run/ikev2-config/.env
