charon {
    load_modular = yes

    # Some mobile networks and Android/Windows clients drop larger IKE_AUTH fragments.
    # Keep IKEv2 fragments small enough for UDP/4500 over NAT.
    fragment_size = 576

    plugins {
        include strongswan.d/charon/*.conf

        # Windows IKEv2 EAP authentication requires an identity exchange.
        # Keep these plugins explicit instead of relying on distro defaults.
        eap-identity {
            load = yes
        }
        eap-mschapv2 {
            load = yes
        }
    }
}

include strongswan.d/*.conf
